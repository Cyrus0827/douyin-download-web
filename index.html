<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title></title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #000;
      font-family: system-ui, sans-serif;
    }
    button {
      font-size: clamp(48px, 15vw, 120px);
      padding: 0.4em 1em;
      border: none;
      border-radius: 0.15em;
      background: #fff;
      color: #000;
      cursor: pointer;
      transition: transform 0.1s;
      min-width: 2.5em;
    }
    button:active { transform: scale(0.95); }
    button:disabled { cursor: not-allowed; opacity: 0.7; }

    #popup {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      color: #000;
      font-size: clamp(18px, 4vw, 28px);
      padding: 0.5em 1em;
      border-radius: 0.1em;
      text-align: center;
      max-width: 90vw;
      word-break: break-all;
      display: none;
      z-index: 9999;
    }
    #popup.show { display: block; }

    #log {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #111;
      color: #fff;
      font-family: monospace;
      font-size: clamp(12px, 2vw, 16px);
      padding: 0.4em 0.6em;
      max-height: 30vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #log div { white-space: pre-wrap; word-break: break-all; }
    #log .err { color: #f55; }
    #log .warn { color: #ff0; }
    #log .ok { color: #0f0; }

    #inputWrap {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 90vw;
      max-width: 600px;
      display: none;
      flex-direction: column;
      gap: 0.5em;
      z-index: 100;
    }
    #urlInput {
      width: 100%;
      font-size: clamp(18px, 4vw, 28px);
      padding: 0.4em 0.6em;
      border: 2px solid #fff;
      border-radius: 0.1em;
      background: #000;
      color: #fff;
      outline: none;
    }
    #urlInput::placeholder { color: #888; }
    #confirmBtn {
      font-size: clamp(20px, 4vw, 32px);
      padding: 0.3em 0.6em;
      border: 2px solid #fff;
      border-radius: 0.1em;
      background: #fff;
      color: #000;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <button id="btn">下载</button>
  <div id="popup"></div>
  <div id="log"></div>
  <div id="inputWrap">
    <input id="urlInput" type="url" inputmode="url" placeholder="粘贴抖音链接" />
    <button id="confirmBtn">确定</button>
  </div>
  <script>
    const btn = document.getElementById('btn');
    const popup = document.getElementById('popup');
    const logEl = document.getElementById('log');
    const inputWrap = document.getElementById('inputWrap');
    const urlInput = document.getElementById('urlInput');
    const confirmBtn = document.getElementById('confirmBtn');
    let popupTimer = null;

    function log(msg, type) {
      const d = document.createElement('div');
      d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      if (type) d.className = type;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function showPopup(msg) {
      if (popupTimer) clearTimeout(popupTimer);
      popup.textContent = msg;
      popup.classList.add('show');
      popupTimer = setTimeout(() => popup.classList.remove('show'), 3000);
    }

    // 核心处理函数
    async function handleDownload(sourceText) {
      btn.textContent = '...';
      btn.disabled = true;
      logEl.innerHTML = '';
      inputWrap.style.display = 'none';

      try {
        const text = sourceText || urlInput.value.trim();
        if (!text) {
          log('错误: 输入为空', 'err');
          showPopup('输入为空');
          done();
          return;
        }

        log('读取链接...');

        // 正则匹配
        const match = text.match(/https?:\/\/(?:v\.douyin\.com|www\.iesdouyin\.com)\/[^\s]+/);
        if (!match) {
          log('错误: 未识别到抖音链接', 'err');
          showPopup('未识别到抖音链接');
          done();
          return;
        }
        log('识别到链接: ' + match[0]);

        // 调API
        let json;
        try {
          log('调用API...');
          const apiRes = await fetch('/proxy?url=' + encodeURIComponent(match[0]));
          json = await apiRes.json();
          log('API响应: code=' + json.code + ', type=' + (json.data?.type || 'unknown'));
        } catch (e) {
          log('错误: API调用失败 - ' + e.message, 'err');
          showPopup('API调用失败');
          done();
          return;
        }

        if (json.code !== 200) {
          log('错误: API返回错误码 ' + json.code, 'err');
          showPopup('API返回错误');
          done();
          return;
        }

        if (!json.data) {
          log('错误: 无数据', 'err');
          showPopup('无数据');
          done();
          return;
        }

        // 取视频URL
        let videoUrl = null;
        let sourceType = '';

        if (json.data.url) {
          videoUrl = json.data.url;
          sourceType = '普通视频';
        } else if (json.data.live_photo && json.data.live_photo[0] && json.data.live_photo[0].video) {
          videoUrl = json.data.live_photo[0].video;
          sourceType = '实况视频';
        } else if (json.data.images && json.data.images[0]) {
          videoUrl = json.data.images[0];
          sourceType = '图集';
        }

        if (!videoUrl) {
          log('错误: 无法解析视频地址', 'err');
          showPopup('无法解析视频地址');
          done();
          return;
        }
        log('视频来源: ' + sourceType);

        // 取标题前10字
        const rawTitle = json.data.title || 'video';
        if (!json.data.title) log('警告: 标题为空，使用默认值', 'warn');
        const safeName = rawTitle.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '').slice(0, 10) || 'video';
        const ext = videoUrl.includes('webp') || videoUrl.includes('image') ? '.jpg' : '.mp4';
        log('文件名: ' + safeName + ext);

        // 下载
        try {
          log('正在抓取视频...');
          const a = document.createElement('a');
          a.href = '/download?url=' + encodeURIComponent(videoUrl) + '&name=' + encodeURIComponent(safeName + ext);
          a.download = safeName + ext;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          log('下载完成', 'ok');
        } catch (e) {
          log('错误: 下载失败 - ' + e.message, 'err');
          showPopup('下载失败');
          done();
          return;
        }

      } catch (e) {
        log('错误: 未知错误 - ' + e.message, 'err');
        showPopup('未知错误');
      }

      done();
    }

    // 主按钮点击：先试剪贴板，不行就显示输入框
    btn.addEventListener('click', async () => {
      logEl.innerHTML = '';
      btn.textContent = '...';
      btn.disabled = true;

      try {
        const text = await navigator.clipboard.readText();
        btn.textContent = '下载';
        btn.disabled = false;
        await handleDownload(text);
        return;
      } catch (e) {
        // 剪贴板不可用，显示输入框
      }

      btn.textContent = '下载';
      inputWrap.style.display = 'flex';
      urlInput.focus();
      log('提示: 请在上方输入框粘贴链接');
    });

    // 输入框确定按钮
    confirmBtn.addEventListener('click', () => {
      handleDownload();
    });

    // 输入框回车
    urlInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleDownload();
      }
    });

    function done() {
      setTimeout(() => {
        btn.textContent = '下载';
        btn.disabled = false;
      }, 800);
    }
  </script>
</body>
</html>
