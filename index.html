<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title></title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #000;
      font-family: system-ui, sans-serif;
    }
    #wrap {
      width: 90vw;
      max-width: 600px;
      display: flex; flex-direction: column; align-items: center;
      gap: 0.5em;
    }
    #urlInput {
      width: 100%;
      font-size: clamp(18px, 4vw, 28px);
      padding: 0.4em 0.6em;
      border: 2px solid #fff;
      border-radius: 0.1em;
      background: #000;
      color: #fff;
      outline: none;
    }
    #urlInput::placeholder { color: #888; }
    button {
      font-size: clamp(36px, 10vw, 80px);
      padding: 0.3em 0.8em;
      border: none;
      border-radius: 0.15em;
      background: #fff;
      color: #000;
      cursor: pointer;
      min-width: 2em;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    #popup {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      color: #000;
      font-size: clamp(16px, 4vw, 24px);
      padding: 0.5em 1em;
      border-radius: 0.1em;
      text-align: center;
      max-width: 90vw;
      word-break: break-all;
      display: none;
      z-index: 9999;
    }
    #popup.show { display: block; }

    #log {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #111;
      color: #fff;
      font-family: monospace;
      font-size: clamp(11px, 2vw, 15px);
      padding: 0.3em 0.5em;
      max-height: 25vh;
      overflow-y: auto;
    }
    #log div { white-space: pre-wrap; word-break: break-all; margin-bottom: 1px; }
    #log .err { color: #f55; }
    #log .warn { color: #ff0; }
    #log .ok { color: #0f0; }
  </style>
</head>
<body>
  <div id="wrap">
    <input id="urlInput" type="url" inputmode="url" placeholder="粘贴抖音链接" />
    <button id="btn">下载</button>
  </div>
  <div id="popup"></div>
  <div id="log"></div>
  <script>
    const btn = document.getElementById('btn');
    const urlInput = document.getElementById('urlInput');
    const popup = document.getElementById('popup');
    const logEl = document.getElementById('log');
    let popupTimer = null;

    function log(msg, type) {
      const d = document.createElement('div');
      d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      if (type) d.className = type;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function showPopup(msg) {
      if (popupTimer) clearTimeout(popupTimer);
      popup.textContent = msg;
      popup.classList.add('show');
      popupTimer = setTimeout(() => popup.classList.remove('show'), 3000);
    }

    btn.addEventListener('click', async () => {
      const text = urlInput.value.trim();
      if (!text) { showPopup('请先粘贴链接'); return; }

      btn.disabled = true;
      logEl.innerHTML = '';
      log('读取链接...');

      const match = text.match(/https?:\/\/(?:v\.douyin\.com|www\.iesdouyin\.com)\/[^\s]+/);
      if (!match) { log('错误: 未识别到抖音链接', 'err'); showPopup('未识别到抖音链接'); btn.disabled = false; return; }
      log('识别到链接: ' + match[0]);

      let json;
      try {
        log('调用API...');
        const r = await fetch('https://api.bugpk.com/api/douyin?url=' + encodeURIComponent(match[0]));
        json = await r.json();
        log('API: code=' + json.code + ', type=' + (json.data?.type || '?'));
      } catch (e) { log('错误: API调用失败 - ' + e.message, 'err'); showPopup('API调用失败'); btn.disabled = false; return; }

      if (json.code !== 200 || !json.data) { log('错误: API返回错误', 'err'); showPopup('API返回错误'); btn.disabled = false; return; }

      let videoUrl = null, sourceType = '';
      if (json.data.url) { videoUrl = json.data.url; sourceType = '普通视频'; }
      else if (json.data.live_photo?.[0]?.video) { videoUrl = json.data.live_photo[0].video; sourceType = '实况视频'; }
      else if (json.data.images?.[0]) { videoUrl = json.data.images[0]; sourceType = '图集'; }

      if (!videoUrl) { log('错误: 无法解析视频地址', 'err'); showPopup('无法解析视频地址'); btn.disabled = false; return; }
      log('来源: ' + sourceType);

      const rawTitle = json.data.title || 'video';
      if (!json.data.title) log('警告: 标题为空', 'warn');
      const safeName = rawTitle.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '').slice(0, 10) || 'video';
      const ext = videoUrl.includes('webp') || videoUrl.includes('image') ? '.jpg' : '.mp4';
      log('文件名: ' + safeName + ext);
      log('正在下载...');

      try {
        const res = await fetch(videoUrl);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = safeName + ext;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
        log('下载完成', 'ok');
      } catch (e) {
        log('错误: ' + e.message + '，尝试直接下载', 'warn');
        // CORS失败时直接打开
        const a = document.createElement('a');
        a.href = videoUrl;
        a.download = safeName + ext;
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        log('直接打开，请长按保存', 'warn');
      }
      urlInput.value = '';
      btn.disabled = false;
    });

    urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
  </script>
</body>
</html>
